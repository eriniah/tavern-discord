[versions]
spring = '6.2.19'
google-guava = '33.6.0-jre'
jakarta-annotations = '3.0.0'
rxJava = '3.1.12'

discordJda = '6.4.2'
jDave = '0.1.7'
# Snapshot version for most recent youtube API fix
lavaplayer = '2.2.6'
lavaplayer-youtube = '1.18.1'

mongodb = '5.8.0'

# TODO: Migrate jackson to 3.x.x once jackson-dataformats-text gets a release https://github.com/FasterXML/jackson-dataformats-text
jackson = '2.22.0'
# Note: Jackson annotations dropped the patch version. Additionally, jackson 3.0 uses jackson annotations 2.20+
jacksonAnnotation = '2.22'
joptSimple = '5.0.4'

slf4j = '2.0.18'
log4j = '2.26.0'
jansi = '2.4.3'

# Test
spock = '2.4-groovy-5.0'
hamcrest = '2.2'
byteBuddy = '1.18.10'
objenesis = '3.5'

[libraries]
# Spring
spring-bom = { module = 'org.springframework:spring-bom', version.ref = 'spring' }
spring-core = { module = 'org.springframework:spring-core', version.ref = 'spring' }
spring-context = { module = 'org.springframework:spring-context', version.ref = 'spring' }
spring-beans = { module = 'org.springframework:spring-beans', version.ref = 'spring' }

# Util
google-guava = { module = 'com.google.guava:guava', version.ref = 'google-guava' }
jakarta-annotations = { module = 'jakarta.annotation:jakarta.annotation-api', version.ref = 'jakarta-annotations' }
rxJava = { module = 'io.reactivex.rxjava3:rxjava', version.ref = 'rxJava' }

# Discord JDS API
discordJda = { module = 'net.dv8tion:JDA', version.ref = 'discordJda' }

# JDave (Required for JDA https://jda.wiki/using-jda/troubleshooting/#using-passthrough-dave-session-please-migrate-to-an-implementation-of-libdave)
jdave-api = { module = 'club.minnced:jdave-api', version.ref = 'jDave' }
# Pre-compiled per-platform natives. See https://github.com/MinnDevelopment/jdave?tab=readme-ov-file#installation
jdave-natives-linux-x86x64 = { module = 'club.minnced:jdave-native-linux-x86-64', version.ref = 'jDave' }
jdave-natives-windows-x86x64 = { module = 'club.minnced:jdave-native-win-x86-64', version.ref = 'jDave' }

# Lavaplayer for music streaming
lavaplayer = { module = 'dev.arbjerg:lavaplayer', version.ref = 'lavaplayer' }
# lavalink youtube-source v2 rewritten source manager for lavaplayer
lavaplayer-youtube = { module = 'dev.lavalink.youtube:v2', version.ref = 'lavaplayer-youtube' }

# Mongo
mongodb-bom = { module = 'org.mongodb:mongodb-driver-bom', version.ref = 'mongodb' }

# JSON
jackson-bom = { module = 'com.fasterxml.jackson.core:jackson-bom', version.ref = 'jackson' }
jackson-core = { module = 'com.fasterxml.jackson.core:jackson-core', version.ref = 'jackson' }
jackson-databind = { module = 'com.fasterxml.jackson.core:jackson-databind', version.ref = 'jackson' }
jackson-annotations = { module = 'com.fasterxml.jackson.core:jackson-annotations', version.ref = 'jacksonAnnotation' }
jackson-datatype-jdk8 = { module = 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8', version.ref = 'jackson' }
jackson-dataformat-properties = { module = 'com.fasterxml.jackson.dataformat:jackson-dataformat-properties', version.ref = 'jackson' }

joptSimple = { module = 'net.sf.jopt-simple:jopt-simple', version.ref = 'joptSimple' }

# Logging
slf4j-api = { module = 'org.slf4j:slf4j-api', version.ref = 'slf4j' }
slf4j-ext = { module = 'org.slf4j:slf4j-ext', version.ref = 'slf4j' }

log4j-api = { module = 'org.apache.logging.log4j:log4j-api', version.ref = 'log4j' }
log4j-core = { module = 'org.apache.logging.log4j:log4j-core', version.ref = 'log4j' }
log4j-slf4j = { module = 'org.apache.logging.log4j:log4j-slf4j2-impl', version.ref = 'log4j' }
jansi = { module = 'org.fusesource.jansi:jansi', version.ref = 'jansi' }

# === Testing
# mandatory dependencies for using Spock
spock-bom = { module = 'org.spockframework:spock-bom', version.ref = 'spock' }
spock-core = { module = 'org.spockframework:spock-core', version.ref = 'spock' }

# Optional dependencies for using Spock
hamcrest = { module = 'org.hamcrest:hamcrest-core', version.ref = 'hamcrest' }
byteBuddy = { module = 'net.bytebuddy:byte-buddy', version.ref = 'byteBuddy' }
objenesis = { module = 'org.objenesis:objenesis', version.ref = 'objenesis' }


[bundles]

core = [
    'spring-core',
    'spring-beans',
    'spring-context',
    'google-guava',
    'slf4j-api',
    'slf4j-ext',
    'jakarta-annotations',
    'rxJava'
]

jackson = [
    'jackson-core',
    'jackson-annotations',
    'jackson-databind',
    'jackson-datatype-jdk8',
    'jackson-dataformat-properties'
]

log4j = [
    'log4j-api',
    'log4j-core',
    'log4j-slf4j',
    'jansi'
]

spock = [
    'spock-core',
    'hamcrest',
    'byteBuddy',
    'objenesis',
]


[plugins]

